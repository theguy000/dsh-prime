# Prime mode in two root rows: the Continual Harness plugin (host half) and the
# `@deepseek-ai/dsh-agent-preset` that names the mode. The preset is self-contained —
# a preset's plugin list is never merged with another preset's — so the mode is
# complete on its own; the harness row is separate because the browser bundle table
# is built from the root loader plane only.
#
# Parity note: DSH already ships nearly every prime-agent surface. The rows below
# map onto shipped packages; only `dsh-prime` is new code.
- insert:
    # The host half MUST sit at the root of the loader tree, not inside the preset's
    # config.plugins: dsh-client-modules scans only ctx.loader.entries() (the root
    # plane) when building the browser bundle table, so an agent-plane row is
    # invisible to it and the client half (settings section) never loads.
    - id: dsh-prime
      name: 'dsh-prime'
    - id: preset-prime
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: prime
        name: Prime
        description: prime-agent harness — persistent REPL, programmatic orchestration, agent teams, durable reminders, and a refutable continual harness.
        order: 3
        plugins:
          # ---- training/persona layer: base prompt stays immutable, prime's
          # ---- refinements arrive later as the `dsh-prime` prompt section.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: ""
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ---- RLM: one persistent shell, state carried across calls.
          # ---- Replaces the one-shot pair, which starts from a clean env each call.
          # The group's `isolate` realm matters: a provider that publishes a service
          # into the root realm is a leak, and the registry rejects the whole preset
          # with `Preset services require isolate realms: terminals` — which the mode
          # picker then hides, since it renders only unbroken presets.
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: terminal
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ---- the continual harness is mounted at the ROOT of this patch, not
          # ---- here: it is plane-independent (disk store + /prime/api + prompt
          # ---- section) and nesting it would register that section once per agent.
          # ---- The write half is the exception: a tool must be agent-scoped or it
          # ---- lands in every mode's catalog, so it is a preset row — the same
          # ---- shape the shipped `@deepseek-ai/dsh-tool-subagent-control/list-agents`
          # ---- subpath row uses.
          - id: prime-tool
            name: 'dsh-prime/tool'

          # ---- persistent goals and bounded autonomous rounds.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ---- durable reminders / heartbeats.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: schedule
            name: '@deepseek-ai/dsh-schedule'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. When the operator explicitly asks you to implement now, treat that as authorization to execute; exit plan mode or proceed with mutation tools as the operator directs.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval.

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ---- delegation: retained/parallel subagents, PTC orchestration, and
          # ---- the fresh-agent loop, all enabled because prime is programmatic
          # ---- by default rather than an add-on mode.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # Agent Teams is deliberately absent: its `list_agents` and
          # `interrupt_agent` collide with the delegation group's definitions, and
          # its peer-roster UX is not prime-agent's model (prime delegates from code
          # via the workflow PTC runtime). To opt in, drop `tool-subagent-control`
          # and `tool-subagent-list-agents` and mount
          # `@deepseek-ai/dsh-experimental-agent-team-profile` instead.

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # The one row that makes this prime-agent's model instead of a native
          # tool loop: the agent works through the Node PTC runtime, writing code
          # that calls tools, rather than calling one tool per step. `mode: ptc`
          # waits for the `ptcRuntime` service, which `@deepseek-ai/dsh-base`
          # composes — against a deployment without it the whole preset fails to
          # mount and the mode disappears from the picker.
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
